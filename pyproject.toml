[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "jwst-anomaly"
version = "0.0.1"
description = "Reproducible anomaly discovery in public JWST/MAST data."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "DD-Ching and contributors" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
# Dependencies are pre-declared for all bootstrap units so parallel PRs do not
# collide on this file. Add new ones only with a justification in the PR body.
dependencies = [
    "astropy>=6.1",
    "astroquery>=0.4.11",  # MAST path_lookup helper (D-002); crossmatch fallbacks need >=0.4.8
    "pyvo>=1.5",
    "astropy-healpix>=1.0",  # HEALPix pixel geometry for W5 count maps (D-063)
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=4", "numba>=0.60", "sympy>=1.12", "photutils>=2.0,<4"]  # sympy: X2 S5 radial derivation; photutils: m1931_deblend tests
# Compiled hot loops (E1 GW-GW sky-map classes, S-2); every caller has a numpy fallback.
fast = ["numba>=0.60"]
# Own deblended reference catalogues on level-3 mosaics (scripts/m1931_deblend.py; D-034 addendum ad).
deblend = ["photutils>=2.0,<4"]  # 3.x deprecates the column names used
# Byte-range reads of cloud-hosted FITS (s3://stpubdata) without full downloads.
cloud = ["fsspec>=2024.2", "s3fs>=2024.2"]
# Ordinary microlensing fits (point/finite-source/binary lens, parallax) for W3 vetting (D-054).
mulens = ["MulensModel>=3.12"]
# IceCube public-data likelihood fits (Neutrino Frontier benchmarks; D-080).
nf = ["skyllh>=26.1"]
# Linear-streak masks for the W1 shear screen (STScI findsat_mrt; scripts/w1_streak_mask.py).
streaks = ["acstools>=3.8", "scikit-image>=0.22", "photutils>=1.12"]
# Image simulations of the W1 catalogue-shape responsivity (scripts/w1_r_sim.py).
shearsim = ["galsim>=2.5", "photutils>=3.0"]  # photutils 3 API (n_pixels, semimajor_axis)

[project.scripts]
jwst-anomaly = "jwst_anomaly.cli:main"

[project.urls]
Repository = "https://github.com/DD-Ching/jwst-anomaly-research"

[tool.hatch.build.targets.wheel]
packages = ["src/jwst_anomaly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs internet access to MAST/CDS/etc. (skipped unless --run-network or JWST_ANOMALY_NETWORK=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
