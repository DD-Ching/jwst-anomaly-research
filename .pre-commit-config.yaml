# Local hooks: `pre-commit install`, then `pre-commit run --all-files` (see CONTRIBUTING.md).
# Revisions are pinned release tags; Dependabot (pre-commit ecosystem) proposes updates weekly.
# CI (ci.yml) is authoritative: it runs the latest ruff, which can be newer than the pin below.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      # Same paths as CI's lint job; without `files`, the hooks would also rewrite notebooks and
      # python blocks inside markdown files.
      - id: ruff-check
        args: [--fix]
        files: ^(src|tests|scripts)/
      - id: ruff-format
        files: ^(src|tests|scripts)/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # --enforce-all: also check modified and already-tracked files, not only newly added ones.
      - id: check-added-large-files
        args: [--maxkb=1024, --enforce-all]
      - id: detect-private-key
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
  - repo: local
    hooks:
      # docs/efficiency-rules.md 2.1-2.2: plain-text outputs under results/ <= 500 kB, no tracked
      # raw download ledgers (files older than the rule are listed in the grandfather file).
      - id: results-output-size
        name: results output size and raw ledgers
        entry: python scripts/check_results.py --sizes
        language: python
        pass_filenames: false
        always_run: true
