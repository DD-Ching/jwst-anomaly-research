# Reference sample for the first vertical slice.
# Observation ids, public status and product sizes were checked against MAST on 2026-10-07
# (see SOURCES.md "Data"). Stage parameters are starting points, not tuned values.
name: reference_sample_v1

archive:
  collection: JWST
  calib_level: 3
  data_rights: PUBLIC
  product_subgroups: [CAT, I2D]

samples:
  - id: smacs0723_nircam
    role: science
    description: JWST ERO SMACS J0723.3-7327 lensing cluster, NIRCam imaging (program 2736)
    proposal_id: "2736"
    instrument_name: NIRCAM/IMAGE
    ref_band: F200W
    obs_ids:
      - jw02736-o001_t001_nircam_clear-f090w
      - jw02736-o001_t001_nircam_clear-f150w
      - jw02736-o001_t001_nircam_clear-f200w
      - jw02736-o001_t001_nircam_clear-f277w
      - jw02736-o001_t001_nircam_clear-f356w
      - jw02736-o001_t001_nircam_clear-f444w
    # D-013: colours from DJA v7.4 matched apertures (0.5" diameter, one detection image),
    # not from the pipeline's size-biased encircled-energy apertures.
    matched_photometry:
      url: https://s3.amazonaws.com/grizli-v2/JwstMosaics/v7/smacs0723-grizli-v7.4-fix_phot.fits
      sha256: 361a4eb944fefa3afbbbfe08192d2d5c5764ae7137e41d77c2ce63c5b4a47166
      aperture: 1        # index into ASEC_0..2 = 0.36, 0.5, 0.7 arcsec diameters
      label: dja05
      radius_arcsec: 0.2

  - id: smacs0723_miri
    role: science-aux
    description: Same field, MIRI imaging (program 2736)
    proposal_id: "2736"
    instrument_name: MIRI/IMAGE
    ref_band: F770W
    obs_ids:
      - jw02736-o002_t001_miri_f770w
      - jw02736-o002_t001_miri_f1000w
      - jw02736-o002_t001_miri_f1500w
      - jw02736-o002_t001_miri_f1800w

  - id: ceers_t021
    role: control
    description: CEERS (program 1345) NIRCam pointing t021, non-cluster control field
    proposal_id: "1345"
    instrument_name: NIRCAM/IMAGE
    ref_band: F200W
    # All 7 PUBLIC level-3 NIRCam bands of this pointing on 2026-10-07 (unit 1 query). MAST's
    # s_ra/s_dec here is the MIRI prime target, outside the NIRCam data: use s_region for
    # footprints. Catalogs are jwst 3.0.0 vs 2.0.1 for 2736 (deblending changed; D-010).
    obs_ids:
      - jw01345-o001_t021_nircam_clear-f115w
      - jw01345-o001_t021_nircam_clear-f150w
      - jw01345-o001_t021_nircam_clear-f200w
      - jw01345-o001_t021_nircam_clear-f277w
      - jw01345-o001_t021_nircam_clear-f356w
      - jw01345-o001_t021_nircam_clear-f410m
      - jw01345-o001_t021_nircam_clear-f444w

cloud:
  s3_bucket: stpubdata
  # Verified for programs 2736 and 1345 level-3 products.
  l3_key_pattern: "jwst/public/jw{proposal:05d}/L3/t/o{observation:03d}/{obs_id}_{suffix}"

stages:
  catalog:
    merge_radius_arcsec: 0.1
  quality:  # D-011; thresholds are assumptions
    grid_arcsec: 1.0       # coarse WHT map cell size (one S3 row read per cell row)
    min_rel_weight: 0.5    # x median positive WHT
    min_edge_arcsec: 1.0
    max_artifact_ci: 1.45  # CI_50_30 below this is sharper than the PSF (S/N >= 3 only)
    min_ranked: 20         # fewer survivors -> gate considered unusable, rank ungated
    min_detection_snr: 5   # D-014: best-band aper50 S/N floor (dropouts detected redward pass)
    # D-014: single-band detections need confirmation by a matched-photometry match; samples
    # without matched photometry (MIRI, CEERS today) drop all of them (gates differ per sample).
    require_multiband: true
  classify:  # D-012; stars are ranked as their own stratum '<sample>-stars'
    services: [gaia, simbad]   # bulk CDS XMatch over all sources (~8 s per sample)
    radius_arcsec: 0.5
    gaia_radius_arcsec: 0.3    # any Gaia DR3 source this close counts as the star itself
    star_top_k: 10
    min_stars: 5
    # D-015: point-like (DJA detection-image r50 within 20% of the catalogued stars' median)
    # sources with ordinary stellar colours join the stars; samples need matched photometry.
    stellar_locus:
      calib_mag_range: [20.0, 22.5]
      r50_tolerance: 0.2   # D-016: r50 <= 1.2 r50_psf (one-sided)
      r50_floor: 0.5       # D-016: noise floor, r50 >= 0.5 r50_psf
      mag_max: 24.0
      colours: [[f150w, f444w], [f200w, f356w]]
      colour_pad: 0.3
      min_ref_stars: 10
  features:
    daofind_max_ci: 1.8   # D-013: DAOFind sharpness/roundness only for point-like sources
  rank:
    methods: [robust_z, isolation_forest, lof]
    random_state: 0
  cutouts:
    top_k: 20
    size_arcsec: 3.0
    bands: [F200W]
    spike:                 # D-018: hexagonal-spike flag on NIRCam cutouts (ASSUMPTION thresholds)
      radii_arcsec: [0.2, 0.8]
      search_arcsec: 0.3
      threshold: 3.0
  crossmatch:
    top_k: 20
    radius_arcsec: 1.0
    services: [simbad, ned, gaia]
