name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uvx ruff check src tests scripts
      - run: uvx ruff format --check src tests scripts
      # ruff runs above at the latest version; pre-commit adds large-file/private-key/yaml checks
      - run: uvx pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: ruff-check,ruff-format

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e ".[dev,cloud]"
      - run: uv run --no-sync python -m pytest -q
